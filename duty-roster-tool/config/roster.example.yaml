# カテ待機表 自動作成ツール 設定ファイル（サンプル）
#
# 氏名はここには書かない。実運用の設定は勤務表から生成する:
#   python -m duty_roster init-config -s <勤務割当表.xlsx> -o config/roster.yaml
# config/roster.yaml は .gitignore 済み（氏名を含むためコミットしない）。
#
# このファイルは `python -m duty_roster sample` で作るダミー勤務表と対になっていて、
# そのままツールの動作確認に使える。

members:
  - 担当A   # バックアップ役
  - 担当B
  - 担当C
  - 担当D
  - 担当E
  - 担当F
  - 担当G   # バックアップ役に依存
  - 担当H   # バックアップ役に依存

# 月の日数ごとの待機回数。合計が月の日数と一致していないと起動時にエラーになる。
quota_by_month_length:
  31: {担当A: 4, 担当B: 5, 担当C: 4, 担当D: 4, 担当E: 4, 担当F: 4, 担当G: 3, 担当H: 3}
  30: {担当A: 3, 担当B: 5, 担当C: 4, 担当D: 4, 担当E: 4, 担当F: 4, 担当G: 3, 担当H: 3}
  29: {担当A: 4, 担当B: 5, 担当C: 4, 担当D: 4, 担当E: 3, 担当F: 3, 担当G: 3, 担当H: 3}
  28: {担当A: 3, 担当B: 5, 担当C: 4, 担当D: 4, 担当E: 3, 担当F: 3, 担当G: 3, 担当H: 3}

roles:
  # この人が不在の日は backup_dependents も待機不可（バックアップに入れないため）
  backup_anchor: 担当A
  backup_dependents: [担当G, 担当H]
  # この3名の待機が max_run 日を超えて連続しないようにする（ハード制約）
  consecutive_group: [担当A, 担当G, 担当H]
  consecutive_group_max_run: 2
  # 1人あたり同じ週（日曜始まり）に入る回数の目安
  max_per_week: 2
  # この日数より短い間隔で同じ人が入るのを避ける（1=連日）
  min_gap_days: 3
  # 土日の担当対象者
  weekend_pool: [担当B, 担当C, 担当D, 担当E, 担当F]
  # 日曜は weekend_pool から1人1回ずつ
  sunday_once_each: true
  # 対象者全員が不在の日（日曜・祝日の一斉「公」など）は、不在を理由とする
  # 待機不可を解除する。赤字・黄色セル・土日プール・バックアップ役の条件は残る。
  all_absent_exception: true

# 勤務記号の扱い
plan_codes:
  # 色に関わらず不在扱い（黒字でも不在は待機不可）
  absent_always: ["公", "有", "夏", "リ", "出", "有/公"]
  # 赤字のときだけ不在扱いにしたい記号があればここへ
  absent_if_red: []
  # 祝日・日曜に限り「赤字でなければ待機可能」とする記号
  holiday_relaxed: ["公"]
  # 赤字をどこまで「本人希望の不在」とみなすか: absence_codes / any
  # （実際の勤務表では カテ・ABL の強調にも赤字が使われるため absence_codes 推奨）
  red_scope: absence_codes

# 「―/公」など表記ゆれの読み替え
code_aliases:
  "一/公": "―/公"

# 翌日の勤務内容による優先順位
priority:
  # 翌日の勤務内容をどの行から読むか: both / 予 / 実
  duty_source: both
  mon_thu:
    - ["ME"]                                  # 第1優先
    - ["OHP", "内視"]                         # 第2優先
    - ["災", "業", "労", "研修", "材料"]      # 第3優先（内視と機の間）
    - ["機"]                                  # 第4優先
    - ["OP", "アーム", ""]                    # 第5優先（"" は空白）
  sun:
    - ["ME", "OHP", "内視", "機", "災", "業", "労", "研修", "材料"]
    - ["OP", "アーム", ""]     # 連休のときだけ使う（下記参照）
  # 日曜は、翌日(月)がこれらの勤務（手術室）だけの人は「最後の手段(△)」扱い。"" は空白。
  # 連休（翌日が祝日、または対象者全員が不在）のときはこの制限を外す。
  sun_blocked_next_duties: ["OP", "アーム", ""]
  # 祝日は、その日に出勤している人を待機にする（いる場合）
  holiday_prefer_working: true
  fri_mode: next_day_working   # 金曜は翌日(土)に勤務がある人を優先
  sat_mode: weekend_pool

# 最適化の重み（大きいほど強く避ける）
weights:
  tier: [0, 60, 150, 240, 900]   # 第1〜第5優先のコスト
  fallback_tier: 4000       # どの優先順位にも当てはまらない人を充てた場合
  # ソフト条件の強さは次の順序になるように決めてある:
  #   連日待機を避ける > 前日(土)不在の候補(△)を使わない > 日曜の優先順位
  consecutive: 1500          # 連日待機
  short_gap: 400             # 間隔が min_gap_days 未満（中1日など）
  week_overload: 800         # 同じ週に max_per_week を超えて入る
  holiday_not_working: 3000  # 祝日に、当日出勤者がいるのに他の人を充てる
  sunday_prev_absent: 1300   # 日曜に「前日(土)不在」の候補(△)を充てる
  sunday_next_operating_room: 2500  # 日曜に「翌日(月)が手術室勤務」の候補(△)を充てる
  sunday_tier_multiplier: 20 # 日曜の優先順位を平日より重く扱う倍率（第2優先=60x20=1200）
  ineligible: 1000000       # 待機不可の日に充てた場合（ハード制約）
  group_run: 1000000        # consecutive_group の連続超過（ハード制約）
  holiday_fairness: 15      # 土日祝の回数の偏り

# 色の判定（濃い黄色だけを待機不可とし、薄い黄緑は対象外）
colors:
  yellow_hue: [38, 70]
  yellow_min_saturation: 0.35
  yellow_min_value: 0.60
  red_min_r: 140
  red_max_g: 110
  red_max_b: 110

# 祝日。日付を赤字にし、その日の「公」は赤字でなければ待機可能として扱う。
# 日本の祝日（振替休日・国民の休日を含む）は自動計算するので、通常は空のままでよい。
holidays_auto: true
holidays: []       # 院内の特別休など、追加したい日があればここに
#  - 2026-12-30

# 予備待機表（待機表と同じ形式で、同じ日の「もう1人」を決める）
backup_roster:
  enabled: true
  # 待機が backup_dependents（担当G・担当H）の日は、必ず backup_anchor（担当A）が予備
  forced_anchor_for_dependents: true
  # 土日・祝日は「バックアップ役が不在なら依存2名も不可」を適用しない
  # （予備は土日祝も8名全員が対象）
  anchor_rule_on_weekends: false
  # 予備の回数は目標を見ない人（自動確定の日が多いバックアップ役）
  quota_ignore: [担当A]
  # 予備の連続日数を見ない人（自動確定の日が多く、避けようがないため）
  # 連続日数を見ない人（自動確定の日が多く避けようがないため）。
  # 上限では止めないが、下の日数以上になったら確認事項に出す。
  consecutive_ignore: [担当A]
  consecutive_report_threshold: 4
  # 日曜・祝日の予備を年間で均等にする。ここに書いた人は対象外。
  holiday_fairness_ignore: [担当A]
  # 待機がこの人の日は、予備にこの人たちを入れない
  forbidden_pairs:
    担当C: [担当G]
  # 待機＋予備を合算した連続日数の上限
  max_run_default: 2
  max_run_exceptions:
    担当A: 3
    担当B: 3
  weights:
    quota_deviation: 250   # 目標回数からのズレ（2乗あたり）
    consecutive: 1500      # 待機と予備を合算して連日になる1件あたり
    holiday_fairness: 400  # 日曜・祝日の予備の年間の偏り（2乗あたり）
    violation: 1000000     # ハード制約違反
  search:
    restarts: 12
    iterations: 4000

# 月をまたいだ実績の記録（日曜・祝日の予備を年間で均等にするために使う）。
# 氏名を含むのでリポジトリには入れない（.gitignore 済み）。
history:
  enabled: true
  path: config/history.json

# 先に決まっている担当（ルールに関係なくこのとおり入れる）。
# 毎月変わるものは --fix で渡すほうが手軽。
fixed_assignments: {}
#  2026-10-05: 担当B

# 勤務表から読み取れない事情（色が付いていない希望休など）を手で足す
manual_unavailable: {}
#  担当B:
#    - 2026-09-20
#    - {date: 2026-09-13, reason: 研究会}

# Excel の読み取り（既定は自動検出。うまく検出できないときだけ指定する）
excel:
  sheet: null          # null なら先頭シート
  header_row: null     # null なら 1〜31 が並ぶ行を自動検出
  name_column: null
  kind_column: null
  plan_label: "予"
  actual_label: "実"

# 出力先。-o を付けずに実行したときの保存場所とファイル名。
output:
  # 既定はダウンロードフォルダの中の「待機表」フォルダ（無ければ自動で作る）
  directory: "~/Downloads/待機表"
  filename: "待機表_{year}{month:02d}.xlsx"          # {year} {month} が使える
  backup_filename: "予備待機表_{year}{month:02d}.xlsx"
  # 印刷設定（そのまま印刷できるようにしてある）
  paper_size: 9          # 9 = A4
  paper_landscape: true  # 横向き
  page_margin_inch: 0.4
  center_horizontally: true   # 用紙の左右中央に配置
  center_vertically: true     # 用紙の上下中央に配置（1ページに収まるシートのみ）
  # 担当ごとの待機日数を出す位置（カレンダーの右横）
  counts_column: 9
  counts_row: 3
  # カレンダーの枡目の大きさ（A4横1ページいっぱいになるようにしてある）
  calendar_column_width: 17.0
  calendar_date_row_height: 36.0
  calendar_name_row_height: 36.0
  # 文字の大きさ
  title_font_size: 18
  weekday_font_size: 14
  date_font_size: 14
  name_font_size: 18
  counts_font_size: 12
  # カレンダーのセルの塗り（日曜と祝日は同じ色、土曜は薄い青）
  holiday_fill: "FFFDE9E9"    # 日曜・祝日
  saturday_fill: "FFDEEBF7"   # 土曜
  weekday_fill: null          # 平日は塗らない
  # Windows の共有フォルダに直接出す例:
  #   directory: "//サーバ名/共有/臨床工学科/待機表"
  # デスクトップに出す例:
  #   directory: "~/Desktop/待機表"

# 探索の設定
search:
  seed: 20260101
  restarts: 60
  local_search_iterations: 6000
  sunday_candidates: 16
