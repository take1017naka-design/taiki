[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duty-roster-tool"
version = "0.1.0"
description = "勤務割当表から臨床工学部門の月次カテ待機表を自動作成する"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
duty-roster = "duty_roster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
